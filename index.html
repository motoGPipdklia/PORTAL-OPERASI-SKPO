<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0d">
  <meta
    name="description"
    content="Portal rasmi Sistem Kehadiran dan Penugasan Operasi untuk MotoGP dan Formula 1."
  >
  <title>Portal Rasmi | SKPO</title>

  <link rel="stylesheet" href="css/portal.css?v=20260726-008">
  <script src="js/portal.js?v=20260726-008" defer></script>
</head>

<body>
  <a class="skip-link" href="#pilihanOperasi">Terus ke pilihan operasi</a>

  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="site-header">
    <p class="eyebrow">PORTAL RASMI</p>
    <a class="portal-logo-link" href="./" aria-label="SKPO - Halaman utama">
      <span class="portal-logo-shell">
        <img
          class="portal-logo"
          src="images/logo-skpo.png"
          alt="SKPO"
        >
      </span>
    </a>
  </header>

  <main class="portal-main">
    <section class="hero" aria-labelledby="tajukPortal">
      <h1 id="tajukPortal">Pilih Operasi Anda</h1>
    </section>

    <section
      class="operation-grid"
      id="pilihanOperasi"
      aria-label="Senarai pilihan operasi"
    >
      <a
        class="operation-card motogp-card"
        href="https://motogpipdklia.github.io/SISTEM-KEHADIRAN-PENUGASAN-OPERASI/"
        data-operation="MotoGP"
        aria-label="Masuk ke Sistem Operasi MotoGP"
      >
        <span class="card-glow" aria-hidden="true"></span>

        <span class="card-topline">
          <span class="operation-code">01</span>
          <span class="operation-state">
            <span class="state-dot" aria-hidden="true"></span>
            OP LITAR 2026
          </span>
        </span>

        <span class="card-visual" aria-hidden="true">
          <img
            class="card-photo"
            src="images/motogp-card.jpg"
            alt=""
            loading="eager"
          >
          <span class="card-photo-shade"></span>
        </span>

        <span class="card-content">
          <span class="card-kicker">OP LITAR</span>
          <span class="card-title">MotoGP</span>
          <span class="card-location">Petronas Sepang International Circuit</span>
        </span>

        <span class="card-action">
          <span>MASUK SISTEM</span>
          <span class="arrow" aria-hidden="true">→</span>
        </span>
      </a>

      <a
        class="operation-card f1-card"
        href="https://motogpipdklia.github.io/SISTEM-KEHADIRAN-PENUGASAN-OPERASI-FORMULA-1/"
        data-operation="Formula 1"
        aria-label="Masuk ke Sistem Operasi Formula 1"
      >
        <span class="card-glow" aria-hidden="true"></span>

        <span class="card-topline">
          <span class="operation-code">02</span>
          <span class="operation-state">
            <span class="state-dot" aria-hidden="true"></span>
            OP LITAR 2026
          </span>
        </span>

        <span class="card-visual" aria-hidden="true">
          <img
            class="card-photo"
            src="images/f1-card.jpg"
            alt=""
            loading="eager"
          >
          <span class="card-photo-shade"></span>
        </span>

        <span class="card-content">
          <span class="card-kicker">OP LITAR</span>
          <span class="card-title">Formula 1</span>
          <span class="card-location">Petronas Sepang International Circuit</span>
        </span>

        <span class="card-action">
          <span>MASUK SISTEM</span>
          <span class="arrow" aria-hidden="true">→</span>
        </span>
      </a>
    </section>

    <p class="security-note">
      <span class="lock-icon" aria-hidden="true"></span>
      Pilih operasi yang betul sebelum meneruskan log masuk.
    </p>

    <div class="bottom-logo" aria-label="Logo organisasi">
      <img
        src="images/logo-bawah.png"
        alt="Logo organisasi"
        loading="lazy"
      >
    </div>
  </main>

  <noscript>
    <div class="noscript-note">
      JavaScript tidak aktif. Anda masih boleh memilih dan membuka sistem operasi.
    </div>
  </noscript>
</body>
</html>
